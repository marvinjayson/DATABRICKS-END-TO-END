tables:
  sales.gold.customer_distribution_by_state: "CREATE OR REPLACE TABLE sales.gold.customer_distribution_by_state\
    \ AS\nWITH city_counts AS (\n    SELECT customer_state, customer_city, COUNT(*)\
    \ AS customer_count\n    FROM sales.silver.customers\n    GROUP BY customer_state,\
    \ customer_city\n),\nranked_cities AS (\n    SELECT *, ROW_NUMBER() OVER (PARTITION\
    \ BY customer_state ORDER BY customer_count DESC) AS rn\n    FROM city_counts\n\
    )\nSELECT\n    c.customer_state                  AS state,\n    COUNT(DISTINCT\
    \ c.customer_city)   AS distinct_cities,\n    SUM(c.customer_count)          \
    \   AS total_customers,\n    ROUND(AVG(c.customer_count), 2)   AS avg_customers_per_city,\n\
    \    MAX(CASE WHEN r.rn = 1 THEN r.customer_city  END) AS top_city,\n    MAX(CASE\
    \ WHEN r.rn = 1 THEN r.customer_count END) AS top_city_customers\nFROM city_counts\
    \ c\nJOIN ranked_cities r ON c.customer_state = r.customer_state AND c.customer_city\
    \ = r.customer_city\nGROUP BY c.customer_state\nORDER BY total_customers DESC"
  sales.gold.customer_top_5_states_by_city_diversity: 'CREATE OR REPLACE TABLE sales.gold.customer_top_5_states_by_city_diversity
    AS

    SELECT customer_state AS state, COUNT(DISTINCT customer_city) AS distinct_cities

    FROM sales.silver.customers

    GROUP BY customer_state

    ORDER BY distinct_cities DESC

    LIMIT 5'
  sales.gold.order_performance: "CREATE OR REPLACE TABLE sales.gold.order_performance\
    \ AS\nWITH item_summary AS (\n    SELECT order_id,\n        ROUND(SUM(price +\
    \ freight_value), 2) AS order_value,\n        COUNT(*)                       \
    \       AS item_count\n    FROM sales.silver.order_items\n    GROUP BY order_id\n\
    ),\npayment_summary AS (\n    SELECT DISTINCT order_id,\n        FIRST_VALUE(payment_type)\
    \ OVER (PARTITION BY order_id ORDER BY payment_sequential) AS payment_type,\n\
    \        ROUND(SUM(payment_value)              OVER (PARTITION BY order_id), 2)\
    \             AS total_payment,\n        ROUND(AVG(NULLIF(payment_installments,0))\
    \ OVER (PARTITION BY order_id), 2)        AS avg_installments\n    FROM sales.silver.order_payments\n\
    ),\nreviews_summary AS (\n    SELECT order_id, ROUND(AVG(review_score), 2) AS\
    \ avg_review_score\n    FROM sales.silver.order_reviews\n    GROUP BY order_id\n\
    )\nSELECT o.order_id,\n    DATE(o.order_purchase_timestamp) AS purchase_date,\n\
    \    o.order_status_group, o.delivery_days, o.delay_days,\n    i.order_value,\
    \ i.item_count,\n    p.payment_type, p.total_payment, p.avg_installments,\n  \
    \  r.avg_review_score\nFROM sales.silver.orders o\nLEFT JOIN item_summary    i\
    \ ON o.order_id = i.order_id\nLEFT JOIN payment_summary p ON o.order_id = p.order_id\n\
    LEFT JOIN reviews_summary r ON o.order_id = r.order_id"
  sales.gold.product_category_summary: "CREATE OR REPLACE TABLE sales.gold.product_category_summary\
    \ AS\nSELECT product_category_name,\n    ROUND(AVG(product_weight_g),   2) AS\
    \ avg_weight_g,\n    ROUND(AVG(product_length_cm),  2) AS avg_length_cm,\n   \
    \ ROUND(AVG(product_height_cm),  2) AS avg_height_cm,\n    ROUND(AVG(product_width_cm),\
    \   2) AS avg_width_cm,\n    ROUND(AVG(product_volume_cm3), 2) AS avg_volume_cm3,\n\
    \    ROUND(AVG(product_weight_g / NULLIF(product_volume_cm3, 0)), 3) AS avg_density\n\
    FROM sales.silver.products\nWHERE product_category_name IS NOT NULL\nGROUP BY\
    \ product_category_name\nORDER BY product_category_name"
  sales.gold.product_category_summary_en: "CREATE OR REPLACE TABLE sales.gold.product_category_summary_en\
    \ AS\nSELECT\n    p.product_category_name                                    \
    \                         AS category_pt,\n    COALESCE(l.category_en, p.product_category_name)\
    \                                   AS category_en,\n    INITCAP(REGEXP_REPLACE(COALESCE(l.category_en,\
    \ p.product_category_name), '_', ' ')) AS category_en_display,\n    p.avg_weight_g,\
    \ p.avg_length_cm, p.avg_height_cm,\n    p.avg_width_cm, p.avg_volume_cm3, p.avg_density\n\
    FROM sales.gold.product_category_summary p\nLEFT JOIN sales.silver.category_lookup\
    \ l ON p.product_category_name = l.category_pt\nORDER BY category_en_display"
  sales.gold.seller_city_stats: "CREATE OR REPLACE TABLE sales.gold.seller_city_stats\
    \ AS\nWITH city_agg AS (\n    SELECT INITCAP(seller_city) AS city_display, UPPER(seller_state)\
    \ AS state_code, COUNT(*) AS seller_count\n    FROM sales.silver.sellers\n   \
    \ GROUP BY INITCAP(seller_city), UPPER(seller_state)\n),\ntotal  AS (SELECT SUM(seller_count)\
    \ AS grand_total FROM city_agg),\nranked AS (SELECT *, DENSE_RANK() OVER (ORDER\
    \ BY seller_count DESC, city_display) AS rnk FROM city_agg)\nSELECT r.city_display,\
    \ r.state_code, r.seller_count, r.rnk,\n    ROUND(SUM(r.seller_count) OVER (ORDER\
    \ BY r.rnk ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)\n          / t.grand_total,\
    \ 3) AS cum_share\nFROM ranked r CROSS JOIN total t\nORDER BY r.rnk"
