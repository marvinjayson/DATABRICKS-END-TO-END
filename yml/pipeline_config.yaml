  dq_rules:
    orders:
    - rule_id: BRZ_ORD_001
      layer: Bronze
      columns: order_id
      rule_type: Duplicate check
      expectation: order_id should be unique
      action: Profile duplicates, keep Bronze raw
      severity: Medium
      status: Implemented / Documented
      pii_tag: PII
    - rule_id: SLV_ORD_001
      layer: Silver
      columns: order_status
      rule_type: Standardization
      expectation: delivered/invoiced -> completed; canceled/unavaliable -> canceled;
        else pending
      action: Map to order_status_group
      severity: High
      status: Implemented / Documented
      pii_tag: Non-PII
    - rule_id: SLV_ORD_002
      layer: Silver
      columns: order timestamps
      rule_type: Temporal integrity
      expectation: approved < purchase OR carrier < approved OR delivered < carrier
        marks invalid
      action: Flag is_invalid_timeflow
      severity: High
      status: Implemented / Documented
      pii_tag: Non-PII
    - rule_id: SLV_ORD_003
      layer: Silver
      columns: approved/carrier/customer dates
      rule_type: Completeness
      expectation: Null approved/carrier/customer delivery dates should be visible
      action: Create missing-date boolean flags
      severity: Medium
      status: Implemented / Documented
      pii_tag: PII
    order_reviews:
    - rule_id: BRZ_REV_001
      layer: Bronze
      columns: review_id
      rule_type: Duplicate check
      expectation: Duplicate review_id detected in profiling notes
      action: Resolve in Silver using ROW_NUMBER latest answer/creation timestamp
      severity: High
      status: Implemented / Documented
      pii_tag: PII
    - rule_id: SLV_REV_001
      layer: Silver
      columns: review_score
      rule_type: Constraint
      expectation: review_score must be between 1 and 5
      action: Add CHECK constraint and dedupe valid rows
      severity: High
      status: Implemented / Documented
      pii_tag: Non-PII
    - rule_id: SLV_REV_002
      layer: Silver
      columns: review_id/review_score/timestamps
      rule_type: Quarantine
      expectation: Null review_id, null review_score, or invalid timestamps should
        be isolated
      action: Write _reviews_bad_rows
      severity: High
      status: Implemented / Documented
      pii_tag: PII
    products:
    - rule_id: SLV_PRD_001
      layer: Silver
      columns: product_weight_g/product_length_cm/product_height_cm/product_width_cm
      rule_type: Range check
      expectation: Weight 0-10000; dimensions 0-200
      action: Filter out records outside ranges before Silver write
      severity: High
      status: Implemented / Documented
      pii_tag: Non-PII
    - rule_id: SLV_PRD_002
      layer: Silver
      columns: product_category_name/product_photos_qty
      rule_type: Missing value handling
      expectation: category -> unknown_category; photos -> 1
      action: COALESCE values
      severity: Medium
      status: Implemented / Documented
      pii_tag: Non-PII
    order_items:
    - rule_id: SLV_ITM_001
      layer: Silver
      columns: order_id + order_item_id
      rule_type: Duplicate resolution
      expectation: Keep latest shipping_limit_date, then highest price
      action: ROW_NUMBER per composite key
      severity: High
      status: Implemented / Documented
      pii_tag: PII
    - rule_id: SLV_ITM_002
      layer: Silver
      columns: price/freight_value
      rule_type: Value check
      expectation: price <= 0 or freight_value < 0 should be flagged
      action: Create is_price_nonpositive and is_freight_negative
      severity: Medium
      status: Implemented / Documented
      pii_tag: Non-PII
    - rule_id: SLV_ITM_003
      layer: Silver
      columns: shipping_limit_date
      rule_type: Date range check
      expectation: ship year outside 2017 to 2019 is outlier
      action: Create is_ship_date_outlier
      severity: Low
      status: Implemented / Documented
      pii_tag: Non-PII
    geolocation:
    - rule_id: SLV_GEO_001
      layer: Silver
      columns: zip/city/state/lat/lng
      rule_type: Deduplication
      expectation: One representative row per zip prefix
      action: Use average centroid and mode city/state
      severity: Medium
      status: Implemented / Documented
      pii_tag: Non-PII
    order_performance:
    - rule_id: GLD_ORDPERF_001
      layer: Gold
      columns: order_id
      rule_type: Aggregation grain
      expectation: One row per order after joining item, payment, and review summaries
      action: LEFT JOIN summaries to orders
      severity: High
      status: Implemented / Documented
      pii_tag: PII
